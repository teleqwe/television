[package]
name = "television"
version = "0.2.0"
edition = "2024"
description = "A lightweight NVENC replay buffer for Linux"
license = "MIT"
repository = "https://github.com/teleqwe/television"

[dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
libc = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
zbus = { version = "5", default-features = false, features = ["blocking-api", "tokio"] }

[build-dependencies]
cc = "1.7.0"
pkg-config = "0.3"
tauri-build = { version = "2", features = [] }
